<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지갑 등록소 — 누구 지갑인지 같이 채우기</title>
<style>
:root{
  --bg:#16181c; --panel:#1e2126; --panel2:#262a30; --line:#333940;
  --tx:#e8ecf1; --tx2:#a5aeb9; --tx3:#727b86;
  --blue:#3987e5; --green:#199e70; --red:#e04a4a; --gold:#c98500;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1260px;margin:0 auto;padding:16px 16px 60px}

/* 헤더 */
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-bottom:12px;
  border-bottom:1px solid var(--line);margin-bottom:16px}
.top h1{font-size:19px;margin:0;letter-spacing:-.3px;white-space:nowrap}
.top .sub{color:var(--tx3);font-size:12.5px;flex:1;min-width:180px}
.top .me{display:flex;gap:7px;align-items:center}
.top .me label{font-size:12px;color:var(--tx2);font-weight:600;white-space:nowrap;margin:0}
.top .me input{width:150px}

/* 2단 */
.app{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.col{min-width:0}
.col.right{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding-right:2px}
.col.right h2{position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 6px;margin:0}
#qbox{position:sticky;top:30px;z-index:2}
h2{font-size:14.5px;margin:0 0 10px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
h2 .c{font-size:12px;color:var(--tx3);font-weight:500}

label{display:block;font-size:11.5px;color:var(--tx2);margin:0 0 4px;font-weight:600}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);
  border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 15px;
  font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
button:hover{filter:brightness(1.12)} button:disabled{opacity:.4;cursor:default;filter:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx2)}
button.ghost:hover{border-color:var(--blue);color:var(--tx)}
button.sm{padding:4px 10px;font-size:12px}
button.ok{background:var(--green)} button.no{background:transparent;border:1px solid var(--line);color:var(--tx3)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.notice{background:#1b1e23;border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:8px;padding:9px 12px;font-size:12px;color:var(--tx2);margin-bottom:12px}
.notice b{color:var(--tx)}

/* 현황 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.tile:hover{border-color:var(--blue)}
.tile.on{border-color:var(--blue);background:#20262e}
.tile .n{font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:4px;margin-top:1px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* 지갑 카드 (컴팩트) */
.w{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--panel);overflow:hidden}
.w-h{padding:9px 12px;display:flex;gap:8px;align-items:center;background:var(--panel2);flex-wrap:wrap}
.w-h .ttl{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-h .ttl.none{font-weight:400;color:var(--tx3)}
.w-sub{padding:5px 12px 0;font-size:11.5px;color:var(--tx3);
  font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.w-sub a{color:var(--blue);text-decoration:none;font-family:inherit}
.w-b{padding:6px 12px 11px}
.state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.s-ok{background:rgba(25,158,112,.16);color:#48d19a}
.s-vote{background:rgba(57,135,229,.16);color:#7db6ff}
.s-none{background:rgba(114,123,134,.18);color:var(--tx2)}
.s-bad{background:rgba(224,74,74,.16);color:#ff8a8a}

/* 후보 한 줄 */
.c-row{display:flex;gap:9px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.c-row:first-child{border-top:0}
.c-row .rk{width:26px;flex-shrink:0;text-align:center;font-size:11px;color:var(--tx3);font-weight:700}
.c-row .rk.win{color:var(--gold)}
.c-row .mid{flex:1;min-width:0}
.c-row .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-row .ev{color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-row .sc{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.c-row .sc.p{color:var(--green)} .c-row .sc.m{color:var(--red)}
.c-row .act{display:flex;gap:4px;flex-shrink:0}
.voted{font-size:11px;color:var(--green);font-weight:600;white-space:nowrap}
.tag{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600;white-space:nowrap;
  background:rgba(255,255,255,.07);color:var(--tx2)}

.warn{background:rgba(224,74,74,.1);border:1px solid rgba(224,74,74,.35);border-radius:8px;
  padding:8px 11px;font-size:11.5px;color:#ffa8a8;margin:7px 0}
.warn code{background:rgba(0,0,0,.35);padding:1px 4px;border-radius:3px}
.msg{margin-top:9px;padding:8px 11px;border-radius:8px;font-size:12.5px;display:none}
.msg.err{display:block;background:rgba(224,74,74,.12);border:1px solid rgba(224,74,74,.35);color:#ff9a9a}
.msg.ok{display:block;background:rgba(25,158,112,.14);border:1px solid rgba(25,158,112,.4);color:#5fd6a6}
.empty{color:var(--tx3);text-align:center;padding:30px 14px;font-size:13px}
.tools{display:flex;gap:7px;align-items:center;margin-bottom:10px}
.tools input{flex:1;min-width:0}
.hint{color:var(--tx3);font-size:11.5px}

/* 등록 폼 — 이름 / 근거 두 줄이 전부 */
.f{border-top:1px solid var(--line);padding-top:9px;margin-top:8px}
.f .r1{display:grid;grid-template-columns:1fr 118px;gap:6px;margin-bottom:6px}
.f .r2{display:flex;gap:6px}
.f .r2 input{flex:1}
.f .m{font-size:11.5px;color:#ff9a9a;margin-top:5px;min-height:14px}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--tx3);font-size:11px;line-height:1.7}
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .col.right{position:static;max-height:none;order:-1}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <h1>지갑 등록소</h1>
  <span class="sub">지갑이 누구 것인지 같이 채웁니다. 여기 이름이 폴리곤스캔 화면에 그대로 뜹니다.</span>
  <div class="me"><label>내 닉네임</label>
    <input id="nick" maxlength="20" placeholder="카페 닉네임" spellcheck="false"></div>
</div>

<div class="app">

  <!-- ============ 왼쪽: 등록 현황 ============ -->
  <div class="col left">
    <h2>등록 현황 <span class="c" id="upd"></span></h2>
    <div class="tiles" id="tiles"></div>
    <div class="tools">
      <input id="search" placeholder="이름 · 주소 · 근거로 찾기">
      <button class="ghost sm" id="reload">새로고침</button>
      <button class="ghost sm" id="dl">내려받기</button>
    </div>
    <div id="list"><div class="empty">불러오는 중…</div></div>
  </div>

  <!-- ============ 오른쪽: 확인 · 등록 ============ -->
  <div class="col right">
    <h2>주소 확인 · 등록</h2>
    <div class="notice">
      <b>실명·전화번호는 쓰지 마세요.</b> 닉네임이나 직책만 씁니다. 모든 이름은 <b>추정</b>입니다.
    </div>
    <div class="card" id="qbox">
      <label>지갑 주소 <span style="font-weight:400;color:var(--tx3)">— 여러 개면 줄바꿈</span></label>
      <textarea id="q" class="mono" style="min-height:66px;font-size:12px" spellcheck="false"
        placeholder="0xaaa4d5dd26eb1a2afe5fd5fb529fc24cee89cc2c"></textarea>
      <div class="tools" style="margin:9px 0 0">
        <button id="check">확인</button>
        <button class="ghost sm" id="clear">지우기</button>
        <span class="hint" id="qcount"></span>
      </div>
      <div id="qmsg" class="msg"></div>
    </div>
    <div id="result"></div>
  </div>
</div>

<div class="foot">
  폴리곤 블록체인의 공개 기록과 커뮤니티 제보를 모은 것으로, <b>확정된 사실이 아닌 추정</b>입니다.
  특정 개인·법인의 위법행위를 단정하지 않으며, 정정·삭제 요청은 카페 운영진에게 알려주세요.
</div>
</div>

<script>
/* ==========================================================
   설정 — 아래 두 줄만 본인 것으로 바꾸면 됩니다.
   ========================================================== */
var API_URL    = 'https://script.google.com/macros/s/AKfycbxm5VrjKDvu7cUOJhMWcBy9BsOXdQYMALAXKTBLMvxtjE3fzNDP6RMpl01fhMHY-NAS/exec';               // Apps Script 웹앱 /exec URL
var LABELS_URL = 'labels.json';    // 확정 라벨 (GitHub raw URL 권장)
/* ========================================================== */

var $ = function(id){ return document.getElementById(id); };
var TYPE_KO = {company:'회사 수금',company_payout:'회사 지급',community:'커뮤니티 대표',
  exchange:'거래소',otc:'환전/OTC',bridge:'브릿지',relay:'경유',token:'토큰',
  contract:'컨트랙트',scam_lookalike:'사칭 주소',dust:'더스트',personal:'개인',unknown:'미상'};
var TYPE_OPTS = [['unknown','분류 모름'],['community','커뮤니티 대표'],['company','회사 수금'],
  ['company_payout','회사 지급'],['exchange','거래소'],['otc','환전·OTC'],
  ['personal','개인'],['scam_lookalike','사칭 주소']];

var seed = {labels:{}}, entries = [], votes = {}, filter = '', openForms = {}, checked = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(a){ return String(a||'').trim().toLowerCase(); }
function isAddr(a){ return /^0x[a-f0-9]{40}$/.test(norm(a)); }
function shortA(a){ return a.slice(0,10)+'…'+a.slice(-8); }
function pKey(a){ a=norm(a); return a.slice(2,6)+'|'+a.slice(-4); }
function nick(){ return $('nick').value.trim(); }

/* ---------- 통신 ---------- */
function jsonp(url){
  return new Promise(function(res,rej){
    var cb='cb_'+Math.floor(Math.random()*1e9), s=document.createElement('script');
    var t=setTimeout(function(){cl();rej(new Error('시간 초과'));},25000);
    function cl(){clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=function(d){cl();res(d);};
    s.onerror=function(){cl();rej(new Error('불러오기 실패'));};
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb;
    document.head.appendChild(s);
  });
}
function post(p){
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(p),redirect:'follow'}).then(function(r){ return r.json(); });
}

/* ---------- 데이터 ---------- */
function refresh(){
  return Promise.all([
    fetch(LABELS_URL,{cache:'no-store'}).then(function(r){return r.json();})
      .then(function(j){ seed=j||{labels:{}}; }).catch(function(){ seed={labels:{}}; }),
    (!API_URL ? Promise.resolve() : jsonp(API_URL).then(function(r){
      if(r&&r.ok){ entries=r.data.entries||[]; votes=r.data.votes||{}; }
      else throw new Error(r&&r.error||'응답 오류');
    }))
  ]).then(function(){ renderTiles(); renderList(); renderResult(); })
    .catch(function(e){
      $('list').innerHTML='<div class="empty">목록을 불러오지 못했습니다.<br>'+esc(e.message)+'</div>';
    });
}

function stateOf(addr){
  addr = norm(addr);
  var L = seed.labels && seed.labels[addr];
  var cands = entries.filter(function(e){ return e.address===addr; }).map(function(e){
    var v = votes[e.id] || {up:0,down:0,voters:[]};
    return {e:e, up:v.up, down:v.down, score:v.up-v.down, voters:v.voters||[]};
  }).sort(function(x,y){ return y.score-x.score || y.up-x.up; });

  var kind = (L && (L.type==='scam_lookalike'||L.type==='dust')) ? 'bad'
           : L ? 'ok' : cands.length ? 'vote' : 'none';

  var twins=[], k=pKey(addr), all={};
  Object.keys(seed.labels||{}).forEach(function(x){ all[norm(x)]=1; });
  entries.forEach(function(e){ all[e.address]=1; });
  Object.keys(all).forEach(function(x){ if(x!==addr && pKey(x)===k) twins.push(x); });
  return {addr:addr, kind:kind, label:L, cands:cands, twins:twins};
}
function nameOf(a){ var s=stateOf(a);
  return s.label ? s.label.name : (s.cands[0] ? s.cands[0].e.name : null); }

/* ---------- 카드 ---------- */
var BADGE = {ok:['s-ok','✓ 확정'], vote:['s-vote','투표 중'], bad:['s-bad','⚠ 사칭·스팸'], none:['s-none','이름 없음']};

function walletCard(addr){
  var s = stateOf(addr), b = BADGE[s.kind];
  var title = s.label ? s.label.name : (s.cands[0] ? s.cands[0].e.name : shortA(addr));
  var sub = s.label ? (TYPE_KO[s.label.type]||s.label.type)+' · '+(s.label.confidence||'B')+'등급'
          : (s.cands.length ? '후보 '+s.cands.length+'개' : '');

  var h = '<div class="w" data-w="'+esc(addr)+'">' +
    '<div class="w-h">' +
      '<span class="state '+b[0]+'">'+b[1]+'</span>' +
      '<span class="ttl'+(s.kind==='none'?' none':'')+'" title="'+esc(title)+'">'+esc(title)+'</span>' +
    '</div>' +
    '<div class="w-sub"><span>'+esc(shortA(addr))+'</span>' +
      (sub?'<span>· '+esc(sub)+'</span>':'') +
      '<a href="https://polygonscan.com/address/'+esc(addr)+'" target="_blank" rel="noopener">폴리곤스캔 ↗</a></div>' +
    '<div class="w-b">';

  if(s.twins.length && s.kind!=='bad'){
    h += '<div class="warn"><b>⚠ 앞뒤 4자리가 같은 다른 주소가 있습니다</b><br>' +
      s.twins.slice(0,4).map(function(t){ var n=nameOf(t);
        return '<code>'+esc(shortA(t))+'</code>'+(n?' '+esc(n):''); }).join('<br>') + '</div>';
  }
  if(s.label){
    h += '<div class="c-row"><div class="rk win" style="color:'+(s.kind==='bad'?'var(--red)':'var(--green)')+'">'+
      (s.kind==='bad'?'⚠':'✓')+'</div><div class="mid">' +
      '<div class="ev" style="color:var(--tx2)" title="'+esc(s.label.evidence||'')+'">'+esc(s.label.evidence||'')+'</div>' +
      '</div><span class="tag">확정</span></div>';
  }
  s.cands.forEach(function(c,i){
    var me=nick(), did=me && c.voters.indexOf(me)>=0, win=(i===0 && s.cands.length>1);
    h += '<div class="c-row">' +
      '<div class="rk'+(win?' win':'')+'">'+(win?'1위':(i+1))+'</div>' +
      '<div class="mid"><div class="nm">'+esc(c.e.name)+
        ' <span class="tag">'+esc(TYPE_KO[c.e.type]||c.e.type)+'</span></div>' +
        '<div class="ev" title="'+esc(c.e.evidence)+'">'+esc(c.e.evidence)+' — '+esc(c.e.reporter)+'</div></div>' +
      '<div class="sc '+(c.score>0?'p':c.score<0?'m':'')+'">'+(c.score>0?'+':'')+c.score+'</div>' +
      '<div class="act">' + (did ? '<span class="voted">투표함</span>'
        : '<button class="sm ok" data-v="찬성" data-id="'+esc(c.e.id)+'">맞다</button>' +
          '<button class="sm no" data-v="반대" data-id="'+esc(c.e.id)+'">아니다</button>') +
      '</div></div>';
  });

  var open = openForms[addr];
  h += '<div style="margin-top:8px"><button class="'+(s.kind==='none'?'':'ghost')+' sm" data-open="'+esc(addr)+'">' +
       (open ? '닫기' : (s.kind==='none' ? '이름 달기' : '다른 이름 제안')) + '</button></div>';

  if(open){
    h += '<div class="f" data-form="'+esc(addr)+'">' +
      '<div class="r1">' +
        '<input class="f-name" placeholder="지갑 이름 (예: 강남지사 총판)">' +
        '<select class="f-type">' + TYPE_OPTS.map(function(o){
            return '<option value="'+o[0]+'">'+o[1]+'</option>'; }).join('') + '</select>' +
      '</div>' +
      '<div class="r2">' +
        '<input class="f-ev" placeholder="근거 — 어디서 본 주소인지 (10자 이상)">' +
        '<button class="sm f-go" data-a="'+esc(addr)+'">등록</button>' +
      '</div><div class="m"></div></div>';
  }
  return h + '</div></div>';
}

function bind(root){
  root.querySelectorAll('button[data-id]').forEach(function(b){
    b.onclick=function(){ doVote(b.getAttribute('data-id'), b.getAttribute('data-v')); }; });
  root.querySelectorAll('button[data-open]').forEach(function(b){
    b.onclick=function(){
      var a=b.getAttribute('data-open');
      openForms[a]=!openForms[a];
      renderResult(); renderList();
      var f=document.querySelector('[data-form="'+a+'"] .f-name'); if(f) f.focus();
    }; });
  root.querySelectorAll('.f-go').forEach(function(b){
    b.onclick=function(){ submitOne(b.getAttribute('data-a'), b.closest('.f')); }; });
  root.querySelectorAll('.f-ev').forEach(function(i){
    i.onkeydown=function(e){ if(e.key==='Enter') i.closest('.f').querySelector('.f-go').click(); }; });
}

/* ---------- 동작 ---------- */
function doVote(id, opinion){
  if(!nick()){ alert('오른쪽 위에 닉네임을 먼저 입력해주세요.'); $('nick').focus(); return; }
  if(!API_URL){ alert('API_URL이 설정되지 않았습니다.'); return; }
  post({action:'vote', id:id, voter:nick(), opinion:opinion}).then(function(r){
    if(r.ok) refresh(); else alert(r.error||'투표에 실패했습니다.');
  }).catch(function(){ alert('투표 전송에 실패했습니다.'); });
}
function submitOne(addr, form){
  var msg=form.querySelector('.m');
  var p={action:'submit', address:addr, reporter:nick(),
    name:form.querySelector('.f-name').value.trim(),
    type:form.querySelector('.f-type').value,
    evidence:form.querySelector('.f-ev').value.trim(), link:''};
  if(!API_URL){ msg.textContent='API_URL이 설정되지 않았습니다.'; return; }
  if(!p.reporter){ msg.textContent='닉네임을 입력해주세요.'; return; }
  if(!p.name){ msg.textContent='지갑 이름을 적어주세요.'; return; }
  if(p.evidence.length<10){ msg.textContent='근거를 10자 이상 적어주세요.'; return; }
  var btn=form.querySelector('.f-go'); btn.disabled=true; btn.textContent='등록 중';
  post(p).then(function(r){
    btn.disabled=false; btn.textContent='등록';
    if(r.ok){ openForms[addr]=false; refresh(); }
    else msg.textContent=r.error||'등록에 실패했습니다.';
  }).catch(function(){ btn.disabled=false; btn.textContent='등록'; msg.textContent='전송에 실패했습니다.'; });
}

/* ---------- 확인 결과 ---------- */
function parseQ(){
  var out=[], seen={};
  $('q').value.split(/[\s,;]+/).forEach(function(t){
    var a=norm(t); if(isAddr(a)&&!seen[a]){ seen[a]=1; out.push(a); } });
  return out;
}
function renderResult(){
  var box=$('result');
  if(!checked.length){ box.innerHTML=''; return; }
  var g={ok:[],vote:[],none:[],bad:[]};
  checked.forEach(function(a){ g[stateOf(a).kind].push(a); });
  var h='<div class="card" style="padding:10px 13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--tx2)">' +
    '<b style="color:var(--tx);font-size:14px">'+checked.length+'개 확인</b>' +
    (g.ok.length?'<span><span class="dot" style="background:var(--green)"></span> 확정 '+g.ok.length+'</span>':'') +
    (g.vote.length?'<span><span class="dot" style="background:var(--blue)"></span> 투표 중 '+g.vote.length+'</span>':'') +
    (g.bad.length?'<span><span class="dot" style="background:var(--red)"></span> 사칭 '+g.bad.length+'</span>':'') +
    (g.none.length?'<span><span class="dot" style="background:var(--tx3)"></span> 이름 없음 '+g.none.length+'</span>':'') +
    (g.none.length>1?'<button class="sm" id="bulkOpen" style="margin-left:auto">'+g.none.length+'개 한번에</button>':'') +
    '</div>';
  ['bad','ok','vote','none'].forEach(function(k){ g[k].forEach(function(a){ h+=walletCard(a); }); });
  box.innerHTML=h; bind(box);
  var bo=$('bulkOpen'); if(bo) bo.onclick=function(){ openBulk(g.none); };
}

/* ---------- 여러 개 한번에 ---------- */
function openBulk(addrs){
  var h='<div class="card" id="bulkCard"><h2 style="margin-bottom:8px">이름 없는 '+addrs.length+'개 한번에</h2>' +
    '<div class="hint" style="margin-bottom:9px">아는 것만 적으세요. 비워둔 줄은 등록되지 않습니다.</div>' +
    addrs.map(function(a){
      return '<div style="display:grid;grid-template-columns:130px 1fr 108px;gap:5px;margin-bottom:5px;align-items:center">' +
        '<span class="mono" style="font-size:11px;color:var(--tx3)" title="'+esc(a)+'">'+esc(a.slice(0,8)+'…'+a.slice(-6))+'</span>' +
        '<input class="b-name" data-a="'+esc(a)+'" placeholder="지갑 이름">' +
        '<select class="b-type" data-a="'+esc(a)+'">'+TYPE_OPTS.map(function(o){
          return '<option value="'+o[0]+'">'+o[1]+'</option>'; }).join('')+'</select></div>';
    }).join('') +
    '<div class="r2" style="display:flex;gap:6px;margin-top:9px">' +
      '<input id="bEv" style="flex:1" placeholder="근거 — 전체 공통 (10자 이상)">' +
      '<button class="sm" id="bGo">등록</button>' +
      '<button class="ghost sm" id="bCancel">취소</button></div>' +
    '<div class="m" id="bMsg" style="font-size:11.5px;color:#ff9a9a;margin-top:5px"></div></div>';
  var box=document.createElement('div'); box.innerHTML=h;
  $('result').insertBefore(box, $('result').firstChild.nextSibling);
  box.querySelector('#bCancel').onclick=function(){ box.remove(); };
  box.querySelector('#bGo').onclick=function(){
    var msg=box.querySelector('#bMsg'), ev=box.querySelector('#bEv').value.trim();
    if(!nick()){ msg.textContent='닉네임을 입력해주세요.'; return; }
    if(ev.length<10){ msg.textContent='근거를 10자 이상 적어주세요.'; return; }
    var items=[];
    box.querySelectorAll('.b-name').forEach(function(inp){
      var nm=inp.value.trim(); if(!nm) return;
      var a=inp.getAttribute('data-a');
      items.push({address:a, name:nm, type:box.querySelector('.b-type[data-a="'+a+'"]').value}); });
    if(!items.length){ msg.textContent='이름을 하나 이상 적어주세요.'; return; }
    var b=box.querySelector('#bGo'); b.disabled=true; b.textContent='등록 중';
    post({action:'bulk', reporter:nick(), evidence:ev, items:items}).then(function(r){
      b.disabled=false; b.textContent='등록';
      if(r.ok){ box.remove(); refresh(); } else msg.textContent=r.error||'등록에 실패했습니다.';
    }).catch(function(){ b.disabled=false; b.textContent='등록'; msg.textContent='전송에 실패했습니다.'; });
  };
}

/* ---------- 현황 ---------- */
function allAddrs(){
  var m={};
  Object.keys(seed.labels||{}).forEach(function(a){ m[norm(a)]=1; });
  entries.forEach(function(e){ m[e.address]=1; });
  return Object.keys(m);
}
function renderTiles(){
  var c={ok:0,vote:0,none:0,bad:0}, all=allAddrs();
  all.forEach(function(a){ c[stateOf(a).kind]++; });
  var t=[['','전체',all.length,'var(--tx2)'],['ok','확정',c.ok,'var(--green)'],
         ['vote','투표 중',c.vote,'var(--blue)'],['bad','사칭·스팸',c.bad,'var(--red)']];
  $('tiles').innerHTML=t.map(function(x){
    return '<div class="tile'+(filter===x[0]?' on':'')+'" data-f="'+x[0]+'">' +
      '<div class="n">'+x[2]+'</div><div class="k"><span class="dot" style="background:'+x[3]+'"></span>'+x[1]+'</div></div>';
  }).join('');
  $('tiles').querySelectorAll('.tile').forEach(function(el){
    el.onclick=function(){ filter=el.getAttribute('data-f'); renderTiles(); renderList(); }; });
  $('upd').textContent = seed.updated ? '라벨 '+seed.updated : '';
}
function renderList(){
  var q=norm($('search').value);
  var arr=allAddrs().filter(function(a){
    var s=stateOf(a);
    if(filter && s.kind!==filter) return false;
    if(!q) return true;
    if(a.indexOf(q)>=0) return true;
    if(s.label && (norm(s.label.name).indexOf(q)>=0 || norm(s.label.evidence).indexOf(q)>=0)) return true;
    return s.cands.some(function(c){ return norm(c.e.name).indexOf(q)>=0 ||
      norm(c.e.evidence).indexOf(q)>=0 || norm(c.e.reporter).indexOf(q)>=0; });
  });
  var ord={ok:0,vote:1,bad:2,none:3};
  arr.sort(function(x,y){
    var sx=stateOf(x), sy=stateOf(y);
    if(ord[sx.kind]!==ord[sy.kind]) return ord[sx.kind]-ord[sy.kind];
    return (sy.cands[0]?sy.cands[0].score:0)-(sx.cands[0]?sx.cands[0].score:0);
  });
  if(!arr.length){ $('list').innerHTML='<div class="empty">해당하는 지갑이 없습니다.</div>'; return; }
  $('list').innerHTML=arr.slice(0,150).map(walletCard).join('') +
    (arr.length>150?'<div class="empty">…외 '+(arr.length-150)+'개. 검색으로 좁혀보세요.</div>':'');
  bind($('list'));
}

/* ---------- 내려받기 ---------- */
$('dl').onclick=function(){
  var out=JSON.parse(JSON.stringify(seed)); out.labels=out.labels||{};
  allAddrs().forEach(function(a){
    if(out.labels[a]) return;
    var t=stateOf(a).cands[0];
    if(!t || t.score<1) return;
    out.labels[a]={name:t.e.name+' (추정)', type:t.e.type, confidence:t.score>=5?'B':'C',
      evidence:t.e.evidence, source:'커뮤니티 제보 '+t.e.reporter+' · 찬성'+t.up+'/반대'+t.down, added:t.e.ts};
  });
  out.updated=new Date().toISOString().slice(0,10);
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='labels.json'; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
};

/* ---------- 이벤트 ---------- */
$('check').onclick=function(){
  var m=$('qmsg'); m.className='msg';
  var list=parseQ();
  if(!list.length){ m.className='msg err'; m.textContent='올바른 주소(0x + 40자리)를 입력해주세요.'; return; }
  checked=list; renderResult();
};
$('clear').onclick=function(){ $('q').value=''; checked=[]; $('qcount').textContent='';
  $('qmsg').className='msg'; renderResult(); };
$('q').addEventListener('input',function(){
  var n=parseQ().length; $('qcount').textContent = n?n+'개 인식':''; });
$('search').addEventListener('input', renderList);
$('reload').onclick=refresh;
$('nick').addEventListener('input',function(){ renderResult(); renderList(); });

(function(){ var p=new URLSearchParams(location.search).get('add');
  if(p) $('q').value=p.split(',').join('\n'); })();

refresh().then(function(){ if($('q').value.trim()) $('check').click(); });
</script>
